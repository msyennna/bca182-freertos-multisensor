[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

; Use the STM32CubeMX-generated configuration rather than PlatformIO defaults.
board_build.stm32cube.custom_config_header = yes
board_build.stm32cube.system_file = $PROJECT_DIR/system/system_stm32f1xx.c
board_build.stm32cube.disable_embedded_libs = yes
board_build.ldscript = $PROJECT_DIR/STM32F103xx_FLASH.ld

lib_archive = no
check_tool = cppcheck
check_skip_packages = yes

build_flags =
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3
    -fno-exceptions
    -fno-rtti


[env:native]
platform = native
test_framework = unity
build_flags =
    -I include